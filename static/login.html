<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F2F5F5">
<title>EyePath Connect</title>
<script>(function(){try{var t=localStorage.getItem("eyepath-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
</head>
<body>
<div class="center">
  <div class="login">
    <div class="brand"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12C5 7 8.5 5 12 5s7 2 10 7c-3 5-6.5 7-10 7S5 17 2 12Z"/><circle cx="14" cy="12" r="3" fill="currentColor" stroke="none"/></svg><span>EyePath</span></div>
    <h1>Connect your phone</h1>
    <p id="expired" class="err" hidden>That QR code is out of date. Scan the one on the client screen now.</p>
    <p id="err" class="err" hidden>That code didn't match. Check the code on the client screen and try again.</p>
    <p class="help">Enter the code shown on the client screen, or scan its QR code.</p>
    <form method="post" action="/login">
      <input name="code" placeholder="Code, e.g. K7P-4QD" autocomplete="off" autocapitalize="characters"
             spellcheck="false" autofocus required>
      <input type="hidden" name="next" id="next">
      <button type="submit">Connect</button>
    </form>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("next").value = q.get("next") || "/therapist";
  document.getElementById("err").hidden = !q.has("bad");
  document.getElementById("expired").hidden = !q.has("expired");
</script>
</body>
</html>
